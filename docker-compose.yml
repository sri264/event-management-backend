# Optional: MySQL in Docker (use if MySQL is not installed locally).
# If you use this, set DB_PORT=3307 and DB_PASSWORD=Root@264 in .env
services:
  mysql:
    image: mysql:8.4
    container_name: eventnest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root@264
      MYSQL_DATABASE: eventnest_db
    ports:
      - '3307:3306'
    volumes:
      - eventnest_mysql_data:/var/lib/mysql

volumes:
  eventnest_mysql_data:
